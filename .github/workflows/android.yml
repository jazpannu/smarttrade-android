name: Android app

on:
  push:
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Write the signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD repo secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SmartTrade-${{ github.sha }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartTrade-apk
          path: SmartTrade-*.apk
          retention-days: 30
      - name: Publish the APK as the "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SmartTrade-${{ github.sha }}.apk SmartTrade.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SmartTrade.apk --title "SmartTrade (latest build)" \
            --notes "Built from ${{ github.sha }}. Install SmartTrade.apk on your phone." --latest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports
