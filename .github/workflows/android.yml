name: Android app

on:
  push:
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Write the signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD_SECRET: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD_SECRET" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_PASSWORD=$SIGNING_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            # No fixed key yet: sign with a random throwaway key so there is still an APK to install.
            # Each such build has a different key, so installing it over an older one needs an uninstall first.
            echo "::warning::No SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD secrets - signing with a random one-off key."
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias smarttrade \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SmartTrade test build" \
              -storepass "$PW" -keypass "$PW" -noprompt
            echo "SIGNING_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SmartTrade-${{ github.sha }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartTrade-apk
          path: SmartTrade-*.apk
          retention-days: 30
      - name: Publish the APK as the "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SmartTrade-${{ github.sha }}.apk SmartTrade.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SmartTrade.apk --title "SmartTrade (latest build)" \
            --notes "Built from ${{ github.sha }}. Install SmartTrade.apk on your phone." --latest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports
